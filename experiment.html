<script>
// ========== 雪花实现（数量可调） ==========
const snowContainer = document.getElementById('snowContainer');

function createSnow(count) {
  snowContainer.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const flake = document.createElement('div');
    flake.classList.add('snowflake');
    const size = Math.random() * 5 + 2;
    const startX = Math.random() * window.innerWidth;
    const duration = Math.random() * 7 + 6;
    const sway = Math.random() * 80 - 40;
    flake.style.width = size + 'px';
    flake.style.height = size + 'px';
    flake.style.opacity = Math.random() * 0.5 + 0.35;
    flake.style.left = startX + 'px';
    flake.style.top = '-10px';
    flake.animate([
      { transform: `translate(0px,0px)` },
      { transform: `translate(${sway}px, ${window.innerHeight + 20}px)` }
    ], {
      duration: duration * 1000,
      iterations: Infinity,
      delay: Math.random() * 8000
    });
    snowContainer.appendChild(flake);
  }
}

createSnow(130); // 默认 130 片

// ========== 设置弹窗：滑块实时调整雪花密度 ==========
const expSettingBtn = document.getElementById('expSettingBtn');
const expGlassPop = document.getElementById('expGlassPop');
const snowRange = document.getElementById('snowRange');
const snowVal = document.getElementById('snowVal');

expSettingBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  expGlassPop.hidden = !expGlassPop.hidden;
});
document.addEventListener('click', function (e) {
  if (!expGlassPop.hidden && !(expGlassPop.contains(e.target) || expSettingBtn.contains(e.target))) {
    expGlassPop.hidden = true;
  }
});
snowRange.addEventListener('input', function () {
  const v = Number(snowRange.value);
  snowVal.textContent = v;
  createSnow(v); // 实时重建
});

// ========== 背景图片切换（保留雪花深色遮罩） ==========
const expBgList = document.getElementById('expBgList');
function applyExpBg(url) {
  if (url) {
    document.documentElement.style.setProperty('--exp-bg', 'url("' + url + '")');
  } else {
    document.documentElement.style.removeProperty('--exp-bg');
  }
}
function markExpBg(url) {
  const opts = expBgList.querySelectorAll('.bg-opt');
  for (let i = 0; i < opts.length; i++) {
    opts[i].classList.toggle('active', opts[i].getAttribute('data-bg') === url);
  }
}
expBgList.addEventListener('click', function (e) {
  let t = e.target;
  while (t && t !== expBgList && !(t.getAttribute && t.getAttribute('data-bg'))) t = t.parentNode;
  const url = t && t.getAttribute ? t.getAttribute('data-bg') : null;
  if (!url) return;
  applyExpBg(url);
  markExpBg(url);
});
// 上传本地图片作为背景（即时生效，刷新恢复默认）
const expBgUpload = document.getElementById('expBgUpload');
expBgUpload.addEventListener('change', function () {
  const file = expBgUpload.files && expBgUpload.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    const url = String(reader.result);
    applyExpBg(url);
    // 上传后清除内置选项高亮
    const opts = expBgList.querySelectorAll('.bg-opt');
    for (let i = 0; i < opts.length; i++) opts[i].classList.remove('active');
    expBgUpload.value = '';
  };
  reader.readAsDataURL(file);
});
// 默认背景（starlight-idol-celebration）已在 CSS 变量缺省时生效

// ========== 回到顶部 ==========
const backTopBtn = document.getElementById('backTop');
window.addEventListener('scroll', () => {
  if (window.scrollY > 300) {
    backTopBtn.classList.add('show');
  } else {
    backTopBtn.classList.remove('show');
  }
});
backTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>

<!-- ===== 隐藏彩蛋：隐秘入口 + 模拟下载中心（注入） ===== -->
<div id="eggOverlay">
  <div id="eggGlass">
    <h3>隐秘入口</h3>
    <div class="egg-hint">请输入通行口令</div>
    <input id="eggPwd" type="password" placeholder="••••••••" autocomplete="off">
    <div class="egg-err" id="eggErr"></div>
    <button class="egg-btn" id="eggOk">进入</button>
  </div>
</div>
<div id="eggDlOverlay">
  <div id="eggDlHead">
    <h2>模拟下载中心</h2>
    <button id="eggDlBack">返回</button>
  </div>
  <div id="eggDlBody">
    <table id="eggDlTable">
      <thead><tr><th>名称</th><th>大小</th><th>操作</th></tr></thead>
      <tbody id="eggDlTbody"></tbody>
    </table>
    <div id="eggDlEmpty">暂无文件</div>
  </div>
</div>

<script>
(function () {
  var PWD = 'xx xxx';
  var SEQ = 'wwssaaddqe';
  var keys = '';
  var ov = document.getElementById('eggOverlay');
  var dl = document.getElementById('eggDlOverlay');
  var pwd = document.getElementById('eggPwd');
  var err = document.getElementById('eggErr');
  var tbody = document.getElementById('eggDlTbody');
  var empty = document.getElementById('eggDlEmpty');
  var DLBASE = '/text/' + encodeURIComponent('download？？？') + '/';

  function fmt(n) {
    if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
    if (n >= 1048576) return (n / 1048576).toFixed(2) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(2) + ' KB';
    return (n || 0) + ' B';
  }
  function showPwd() { keys = ''; ov.classList.add('on'); pwd.value = ''; err.textContent = ''; setTimeout(function () { pwd.focus(); }, 30); }
  function hidePwd() { ov.classList.remove('on'); }
  function hideDl() { dl.classList.remove('on'); }
  function loadDl() {
    fetch(DLBASE + 'files.json').then(function (r) { return r.json(); }).then(function (list) {
      tbody.innerHTML = '';
      var arr = Array.isArray(list) ? list : [];
      empty.style.display = arr.length ? 'none' : 'block';
      empty.textContent = '暂无文件';
      arr.forEach(function (it) {
        var tr = document.createElement('tr');
        var td1 = document.createElement('td'); td1.className = 'egg-name'; td1.textContent = it.name;
        var td2 = document.createElement('td'); td2.textContent = fmt(it.size);
        var td3 = document.createElement('td');
        var a = document.createElement('a'); a.className = 'egg-dl-btn'; a.textContent = '下载';
        a.href = DLBASE + encodeURIComponent(it.name); a.target = '_blank'; a.rel = 'noopener';
        td3.appendChild(a);
        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
        tbody.appendChild(tr);
      });
    }).catch(function () {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      empty.textContent = '加载失败';
    });
  }
  function openDl() { hidePwd(); dl.classList.add('on'); loadDl(); }
  function enter() {
    if (pwd.value === PWD) { openDl(); }
    else { err.textContent = '口令不正确'; pwd.select(); }
  }
  document.addEventListener('keydown', function (e) {
    if (dl.classList.contains('on')) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) {
      if (t.id !== 'eggPwd') keys = '';
      return;
    }
    if (e.key && e.key.length === 1) {
      keys = (keys + e.key.toLowerCase());
      if (keys.length > SEQ.length) keys = keys.slice(-SEQ.length);
      if (keys === SEQ) showPwd();
    }
  });
  document.getElementById('eggOk').addEventListener('click', enter);
  pwd.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') enter(); });
  ov.addEventListener('click', function (e) { if (e.target === ov) hidePwd(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!dl.classList.contains('on')) hidePwd(); }
  });
  document.getElementById('eggDlBack').addEventListener('click', hideDl);
})();
</script>



<!-- ===== 导航栏搜索下拉（注入） ===== -->
<div id="eggSearchWrap" hidden>
  <div id="eggSearchResults"></div>
  <div id="eggSearchEdge" hidden></div>
</div>


<script>
(function () {
  var box = document.getElementById('eggSearchBox');
  var btn = document.getElementById('eggSearchBtn');
  var inp = document.getElementById('eggSearchInput');
  var wrap = document.getElementById('eggSearchWrap');
  var res = document.getElementById('eggSearchResults');
  var edge = document.getElementById('eggSearchEdge');
  var INDEX_URL = '/search-index.json';
  var indexData = null;
  if (!box || !btn) return;

  function isOpen() { return box.classList.contains('active'); }
  function open() {
    box.classList.add('active');
    setTimeout(function () { inp.focus(); }, 200);
  }
  function close() {
    box.classList.remove('active');
    wrap.hidden = true;
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (isOpen()) { close(); } else { open(); }
  });
  document.addEventListener('click', function (e) {
    if (!isOpen()) return;
    if (box.contains(e.target)) return;
    close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen()) close();
  });
  function loadIndex(cb) {
    if (indexData) return cb(indexData);
    fetch(INDEX_URL).then(function (r) { return r.json(); }).then(function (d) {
      indexData = d || []; cb(indexData);
    }).catch(function () { cb(null); });
  }
  function run() {
    var kw = inp.value.trim();
    res.innerHTML = '';
    if (!kw) { wrap.hidden = true; return; }
    wrap.hidden = false;
    edge.hidden = false;
    edge.textContent = '在 Edge 里搜索「' + kw + '」';
    loadIndex(function (data) {
      if (!data) {
        res.innerHTML = '<div class="eggsearch-none">索引加载失败</div>';
        return;
      }
      var k = kw.toLowerCase();
      var m = data.filter(function (it) {
        return (it.title && it.title.toLowerCase().indexOf(k) >= 0) ||
               (it.kw && it.kw.toLowerCase().indexOf(k) >= 0);
      });
      if (!m.length) {
        res.innerHTML = '<div class="eggsearch-none">未找到相关页面</div>';
        return;
      }
      m.forEach(function (it) {
        var a = document.createElement('a');
        a.href = it.path;
        var s = document.createElement('span'); s.textContent = it.title;
        var p = document.createElement('span'); p.className = 'eggsearch-path'; p.textContent = it.path;
        a.appendChild(s); a.appendChild(p);
        res.appendChild(a);
      });
    });
  }
  inp.addEventListener('input', run);
  edge.addEventListener('click', function () {
    var kw = inp.value.trim();
    if (!kw) return;
    window.open('https://www.bing.com/search?q=' + encodeURIComponent(kw), '_blank');
  });
})();
</script>

<script id="fx-polish-js">
(function () {
  "use strict";
  var ov = document.getElementById("eggOverlay");
  var dl = document.getElementById("eggDlOverlay");
  if (!ov && !dl) return;

  var gl = document.createElement("div");
  gl.id = "fxGlitch";
  gl.innerHTML = '<div class="fx-scan"></div><div class="fx-rgb"></div>' +
                 '<div class="fx-code"></div><div class="fx-title">SYSTEM BREACH</div>';
  document.body.appendChild(gl);
  var codeEl = gl.querySelector(".fx-code");
  var timer = null;
  var busy = false;

  function randCode() {
    var chars = "01ABCDEF#$%&@!?<>/|=+*{}[]";
    var out = "";
    for (var i = 0; i < 1400; i++) {
      out += chars.charAt(Math.floor(Math.random() * chars.length));
      if (i % 72 === 71) { out += "\n"; }
    }
    return out;
  }
  function paint() { codeEl.textContent = randCode(); }

  function glitch(ms, done) {
    paint();
    gl.classList.add("on");
    timer = setInterval(paint, 70);
    setTimeout(function () {
      clearInterval(timer);
      timer = null;
      gl.classList.remove("on");
      if (done) { done(); }
    }, ms);
  }

  function watch(el, hideClass, ms) {
    if (!el) { return; }
    new MutationObserver(function () {
      if (busy || !el.classList.contains("on")) { return; }
      busy = true;
      document.body.classList.add(hideClass);
      glitch(ms, function () {
        document.body.classList.remove(hideClass);
        busy = false;
      });
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  watch(ov, "fx-hide-egg", 1100);
  watch(dl, "fx-hide-dl", 1300);

  /* 搜索 / 设置：收起动画 */
  function watchHide(el) {
    if (!el) { return; }
    var closing = false;
    new MutationObserver(function () {
      if (closing || !el.hidden) { return; }
      closing = true;
      el.hidden = false;
      el.classList.add("fx-closing");
      setTimeout(function () {
        el.hidden = true;
        el.classList.remove("fx-closing");
        setTimeout(function () { closing = false; }, 0);
      }, 190);
    }).observe(el, { attributes: true, attributeFilter: ["hidden"] });
  }
  watchHide(document.getElementById("eggSearchWrap"));
  watchHide(document.getElementById("glassPop"));

  /* 音乐列表：展开后若超出屏幕底部，把整个播放器上移，背景随之包住列表 */
  var mw = document.getElementById("musicWidget");
  var ml = document.getElementById("musicList");
  var mb = document.getElementById("navMusicBtn");
  if (mw && ml && mb) {
    function place() {
      if (ml.hidden) { return; }
      var r = mw.getBoundingClientRect();
      var over = r.bottom - (window.innerHeight - 12);
      if (over > 0) {
        var top = parseFloat(window.getComputedStyle(mw).top);
        if (!isFinite(top)) { top = r.top; }
        mw.style.top = Math.max(8, top - over) + "px";
        mw.style.bottom = "auto";
      }
    }
    mb.addEventListener("click", function () { setTimeout(place, 0); });
    window.addEventListener("resize", function () { if (!ml.hidden) { place(); } });
  }
})();
</script>
