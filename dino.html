<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>谷歌恐龙闯关</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Consolas", "Microsoft YaHei", monospace;
    color: #e7e7ef;
    background-color: #0f0f16;
    background-image: url("/pictures/starlight-idol-celebration-2160.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 14, calc(var(--glass-alpha) * 0.66));
    pointer-events: none;
  }
  /* 全站液态玻璃统一变量（设置面板滑块实时驱动） */
  :root {
    --glass-alpha: 1; /* 亮度：玻璃底色浓淡乘数 0.25~1，作用与历史版本一致 */
    --glass-opacity: 1; /* 不透明度：0~1。0 时玻璃背景/模糊/边框完全透明可透过后方图片，1 时与默认一致 */
  }
  /* 顶部跳转栏 */
  .nav {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 46px;
    height: 58px;
    padding: 0 48px;
    background: linear-gradient(135deg, rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.62)), rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.30)));
    backdrop-filter: blur(calc(var(--glass-opacity) * 20px)) saturate(180%);
    -webkit-backdrop-filter: blur(calc(var(--glass-opacity) * 20px)) saturate(180%);
    border-bottom: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.42));
    box-shadow: 0 8px 28px rgba(0, 0, 0, calc(var(--glass-alpha) * 0.16)), inset 0 1px 0 rgba(255, 255, 255, calc(var(--glass-alpha) * 0.55));
    position: relative;
    z-index: 10;
  }
  .nav a {
    font-family: SimSun, "宋体", "Songti SC", serif;
    font-size: 16px;
    color: #000000;
    text-decoration: none;
    line-height: 1;
  }
  .nav a:hover { text-decoration: underline; }
  .nav a.home {
    font-size: 22px;
    color: #1a6dff;
  }
  .nav-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav .nav-setting {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.55));
    border-radius: 50%;
    background: linear-gradient(145deg, rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.34)), rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.14)));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, calc(var(--glass-alpha) * 0.5));
    cursor: pointer;
  }
  .nav .nav-setting img {
    width: 18px;
    height: 18px;
    display: block;
    pointer-events: none;
  }
  .nav .nav-setting:hover {
    background: linear-gradient(145deg, rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.50)), rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.24)));
  }
  .music-widget .nav-music {
    position: relative;
    width: 40px;
    height: 40px;
    padding: 2px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5fa8, #2bd6ff);
    box-shadow: 0 0 12px rgba(43, 214, 255, calc(var(--glass-alpha) * 0.5)), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    cursor: pointer;
  }
  .music-widget .nav-music .nm-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #2bd6ff, #ff5fa8);
  }
  .music-widget .nav-music img {
    width: 18px;
    height: 18px;
    display: block;
    pointer-events: none;
  }
  .music-widget .nav-music:hover {
    transform: scale(1.06);
  }
  .glass-pop {
    position: absolute;
    top: 66px;
    right: 16px;
    width: 320px;
    padding: 16px 18px;
    border-radius: 18px;
    background: linear-gradient(145deg, rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.78)), rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.46)));
    backdrop-filter: blur(calc(var(--glass-opacity) * 20px)) saturate(180%);
    -webkit-backdrop-filter: blur(calc(var(--glass-opacity) * 20px)) saturate(180%);
    border: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.42));
    box-shadow: 0 12px 32px rgba(0, 0, 0, calc(var(--glass-alpha) * 0.24)), inset 0 1px 0 rgba(255, 255, 255, calc(var(--glass-alpha) * 0.55));
    z-index: 999;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #111111;
  }
  .glass-pop[hidden] { display: none; }
  /* 音乐播放器独立浮动组件：默认固定于页面左下角，可鼠标拖动（刷新回默认位） */
  .music-widget {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 300px;
    padding: 12px 14px;
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.80)), rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.50)));
    backdrop-filter: blur(calc(var(--glass-opacity) * 18px)) saturate(180%);
    -webkit-backdrop-filter: blur(calc(var(--glass-opacity) * 18px)) saturate(180%);
    border: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.45));
    box-shadow: 0 12px 32px rgba(0, 0, 0, calc(var(--glass-alpha) * 0.22)), inset 0 1px 0 rgba(255, 255, 255, calc(var(--glass-alpha) * 0.55));
    z-index: 998;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #111111;
    user-select: none;
    -webkit-user-select: none;
    cursor: move;
  }
  .music-widget .mw-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .music-widget .mw-playbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5fa8, #2bd6ff);
    box-shadow: 0 0 8px rgba(43, 214, 255, calc(var(--glass-alpha) * 0.45)), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    cursor: pointer;
  }
  .music-widget .mw-playbtn[hidden] { display: none; }
  .music-widget .mw-playbtn img {
    width: 16px;
    height: 16px;
    display: block;
    pointer-events: none;
  }
  .music-widget .mw-playbtn:hover {
    transform: scale(1.08);
  }
  .music-widget .mw-now {
    flex: 1;
    font-size: 12px;
    color: rgba(17, 17, 17, 0.8);
    min-height: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 播放旋转：内芯持续旋转，播放时 running / 暂停时 paused（保持角度，平滑过渡） */
  @keyframes mw-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .music-widget .nav-music .nm-inner {
    animation: mw-spin 2.4s linear infinite;
    animation-play-state: paused;
  }
  .music-widget .nav-music.mw-playing .nm-inner {
    animation-play-state: running;
  }
  .mw-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .mw-time {
    font-size: 11px;
    color: rgba(17, 17, 17, 0.75);
    min-width: 34px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #musicSeek {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 4px;
    background: linear-gradient(90deg, #ff5fa8, #2bd6ff);
    outline: none;
    cursor: pointer;
  }
  #musicSeek::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5fa8, #2bd6ff);
    border: 2px solid #ffffff;
    box-shadow: 0 0 6px rgba(255, 105, 180, 0.6);
  }
  #musicSeek::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 2px solid #ffffff;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5fa8, #2bd6ff);
    cursor: pointer;
  }
  .mw-list {
    max-height: 160px;
    overflow-y: auto;
  }
  .music-widget .mw-list[hidden] { display: none; }
  .mw-note {
    margin-top: 6px;
    font-size: 11px;
    color: rgba(17, 17, 17, 0.6);
  }
  .gp-head {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .gp-row {
    margin-bottom: 12px;
  }
  .gp-label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .gp-row input[type="range"] {
    width: 100%;
    accent-color: #1a6dff;
    vertical-align: middle;
  }
  .gp-val {
    display: inline-block;
    margin-left: 8px;
    font-size: 13px;
    font-weight: 600;
    min-width: 40px;
  }
  .gp-bglist {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    max-height: 180px;
    overflow-y: auto;
  }
  .bg-opt {
    flex: 1 1 auto;
    min-width: 0;
    width: auto;
    max-width: 100%;
    text-align: left;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.55));
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(138, 92, 255, 1), rgba(138, 92, 255, 0.3));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, calc(var(--glass-alpha) * 0.5));
    color: #ffffff;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bg-opt:hover {
    background: linear-gradient(135deg, rgba(138, 92, 255, 0.9), rgba(138, 92, 255, 0.4));
  }
  .bg-opt.active {
    border-color: rgba(255, 255, 255, calc(var(--glass-alpha) * 0.95));
    background: linear-gradient(135deg, rgba(138, 92, 255, 1), rgba(138, 92, 255, 0.5));
    box-shadow: 0 0 14px rgba(138, 92, 255, calc(var(--glass-alpha) * 0.7)), inset 0 1px 0 rgba(255, 255, 255, calc(var(--glass-alpha) * 0.5));
  }
  .gp-empty {
    font-size: 13px;
    color: rgba(17, 17, 17, 0.7);
    padding: 4px 2px;
  }
  .gp-note {
    font-size: 12px;
    color: rgba(17, 17, 17, 0.65);
  }
  /* 全站自定义光标：m-1 默认箭头（text 目录本地资源，零外链） */
  body {
    cursor: url('/text/m-1.png') 0 0, auto;
  }
  /* m-2 手型：所有可点击元素（含各页面 .dl-btn/.plot-btn/.seg-btn/tr.row/棋盘等） */
  a, button, .bg-opt, .nav-setting, .dl-btn, .plot-btn, .seg-btn, tr.row,
  .board-area canvas, [role="button"], [onclick], select, summary, label,
  input[type="submit"], input[type="radio"], input[type="checkbox"], input[type="file"] {
    cursor: url('/text/m-2.png') 0 0, pointer !important;
  }
  /* 全站液态玻璃滚动条：轨道玻璃半透明、滑块粉色 100% -> 30% 渐变、圆角+内高光，hover 加深 */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track {
    background: linear-gradient(180deg, rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.30)), rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.12)));
    border-radius: 8px;
  }
  *::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(255, 105, 180, 1), rgba(255, 105, 180, 0.3));
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.45));
    box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.35);
  }
  *::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(255, 105, 180, 0.95), rgba(255, 105, 180, 0.5));
  }
  *::-webkit-scrollbar-corner { background: transparent; }

  .game-shell {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 880px;
    margin: 0 auto;
    padding: 26px 28px 30px;
    background: linear-gradient(145deg, rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.14)), rgba(255, 255, 255, calc(var(--glass-alpha) * var(--glass-opacity) * 0.05)));
    backdrop-filter: blur(calc(var(--glass-opacity) * 18px)) saturate(160%);
    -webkit-backdrop-filter: blur(calc(var(--glass-opacity) * 18px)) saturate(160%);
    border: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.2));
    border-radius: 20px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, calc(var(--glass-alpha) * 0.4)), inset 0 1px 0 rgba(255, 255, 255, calc(var(--glass-alpha) * 0.25)), inset 0 -1px 0 rgba(255, 255, 255, calc(var(--glass-alpha) * 0.08));
  }
  h1 { margin: 0 0 14px; font-size: 22px; letter-spacing: 3px; color: #f2f2f7; }
  canvas {
    background: #1d1e28;
    border: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.25));
    border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, calc(var(--glass-alpha) * 0.55)), inset 0 0 0 1px rgba(255, 255, 255, calc(var(--glass-alpha) * 0.08));
  }
  .hint {
    margin-top: 12px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    text-align: center;
  }
  kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid rgba(255, 255, 255, calc(var(--glass-alpha) * 0.3));
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    color: #eee;
  }
</style>
</head>
<body>
  <nav class="nav">
    <a class="home" href="/">主页</a>
    <a href="/download">下载中心</a>
    <a href="/games.html">小游戏中心</a>
    <div class="nav-actions">
      <button type="button" class="nav-setting" id="navSettingBtn" title="设置">
        <img src="/text/setting.png" alt="设置">
      </button>
    </div>
  </nav>
  <div class="music-widget" id="musicWidget" title="可拖动，刷新回到默认位置">
    <div class="mw-head">
      <button type="button" class="nav-music" id="navMusicBtn" title="展开/收起曲目列表" aria-label="音乐播放器">
        <span class="nm-inner"><img src="/text/music.png" alt="音乐"></span>
      </button>
      <div class="mw-now" id="musicNow">未播放</div>
      <button type="button" class="mw-playbtn" id="musicPlayBtn" title="播放/暂停" aria-label="播放/暂停" hidden>
        <img id="musicPlayImg" src="/text/play.png" alt="播放/暂停">
      </button>
    </div>
    <div class="mw-progress">
      <span class="mw-time" id="musicCur">0:00</span>
      <input type="range" id="musicSeek" min="0" max="1000" value="0" step="1" aria-label="播放进度">
      <span class="mw-time" id="musicDur">0:00</span>
    </div>
    <div class="gp-bglist mw-list" id="musicList" hidden>
      <button type="button" class="bg-opt music-opt" data-mp3="/music/Shape%20of%20You.mp3">Shape of You.mp3</button>
<button type="button" class="bg-opt music-opt" data-mp3="/music/%E6%88%91%E6%9C%AC%E5%B0%86%E5%BF%83%E5%90%91%E6%98%8E%E6%9C%88.mp3">我本将心向明月.mp3</button>
<button type="button" class="bg-opt music-opt" data-mp3="/music/%E8%80%81%E7%94%B7%E5%AD%A9.mp3">老男孩.mp3</button>
<button type="button" class="bg-opt music-opt" data-mp3="/music/%E8%99%9E%E5%85%AE%E5%8F%B9.mp3">虞兮叹.mp3</button>
<button type="button" class="bg-opt music-opt" data-mp3="/music/%E9%9B%A8%E7%88%B1.mp3">雨爱.mp3</button>
<button type="button" class="bg-opt music-opt" data-mp3="/music/%E9%B8%B3%E9%B8%AF%E6%88%8F.mp3">鸳鸯戏.mp3</button>
    </div>
    <div class="mw-note">点击曲目播放，再次点击同一曲目暂停/继续；拖动进度条可跳转</div>

  <div class="glass-pop" id="glassPop" hidden>
    <div class="gp-head">站点设置</div>
    <div class="gp-row">
      <span class="gp-label">亮度</span>
      <input type="range" id="glassAlpha" min="25" max="100" value="100" step="1">
      <span class="gp-val" id="glassAlphaVal">100%</span>
    </div>
    <div class="gp-row">
      <span class="gp-label">不透明度</span>
      <input type="range" id="glassOpacity" min="0" max="100" value="100" step="1">
      <span class="gp-val" id="glassOpacityVal">100%</span>
    </div>
    <div class="gp-row">
      <span class="gp-label">背景图片（C:\Thome\Pictures）</span>
      <div class="gp-bglist" id="bgList">
        <button type="button" class="bg-opt" data-bg="/pictures/fragmented-pink-haired-pilot-2160.png">fragmented-pink-haired-pilot-2160.png</button>
<button type="button" class="bg-opt" data-bg="/pictures/holiday-morning-glow-2160.png">holiday-morning-glow-2160.png</button>
<button type="button" class="bg-opt" data-bg="/pictures/neon-grid-descent-2160.png">neon-grid-descent-2160.png</button>
<button type="button" class="bg-opt" data-bg="/pictures/neon-tower-runner-2160.png">neon-tower-runner-2160.png</button>
<button type="button" class="bg-opt" data-bg="/pictures/pastel-dessert-table-2160.png">pastel-dessert-table-2160.png</button>
<button type="button" class="bg-opt" data-bg="/pictures/pink-haired-girl-and-plushies-2160.jpg">pink-haired-girl-and-plushies-2160.jpg</button>
<button type="button" class="bg-opt" data-bg="/pictures/starlight-idol-celebration-2160.jpg">starlight-idol-celebration-2160.jpg</button>
<button type="button" class="bg-opt" data-bg="/pictures/starlight-reverie-2160.jpg">starlight-reverie-2160.jpg</button>
      </div>
    </div>
    <div class="gp-note">改动实时生效，自动保存在本机浏览器</div>
  </div>
  <script>
  (function () {
    var pop = document.getElementById('glassPop');
    var btn = document.getElementById('navSettingBtn');
    var alpha = document.getElementById('glassAlpha');
    var alphaVal = document.getElementById('glassAlphaVal');
    var opacity = document.getElementById('glassOpacity');
    var opacityVal = document.getElementById('glassOpacityVal');
    var bgList = document.getElementById('bgList');
    var musicBtn = document.getElementById('navMusicBtn');
    var musicWidget = document.getElementById('musicWidget');
    var musicList = document.getElementById('musicList');
    var musicNow = document.getElementById('musicNow');
    var musicSeek = document.getElementById('musicSeek');
    var musicCur = document.getElementById('musicCur');
    var musicDur = document.getElementById('musicDur');
    var musicPlayBtn = document.getElementById('musicPlayBtn');
    var musicPlayImg = document.getElementById('musicPlayImg');
    var audio = null;
    var currentMp3 = '';
    var currentLabel = '';
    var KEY_ALPHA = 'thome-glass-alpha';
    var KEY_OPACITY = 'thome-glass-opacity';
    var KEY_BG = 'thome-bg';

    function setVar(name, v) {
      document.documentElement.style.setProperty(name, String(v));
    }
    function applyAlpha(v) {
      setVar('--glass-alpha', v / 100);
      try { localStorage.setItem(KEY_ALPHA, String(v)); } catch (e) {}
    }
    function applyOpacity(v) {
      setVar('--glass-opacity', v / 100);
      try { localStorage.setItem(KEY_OPACITY, String(v)); } catch (e) {}
    }
    alpha.addEventListener('input', function () {
      alphaVal.textContent = alpha.value + '%';
      applyAlpha(alpha.value);
    });
    opacity.addEventListener('input', function () {
      opacityVal.textContent = opacity.value + '%';
      applyOpacity(opacity.value);
    });
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      pop.hidden = !pop.hidden;
    });
    musicBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      musicList.hidden = !musicList.hidden;
    });
    document.addEventListener('click', function (e) {
      if (!pop.hidden && !(pop.contains(e.target) || btn.contains(e.target))) {
        pop.hidden = true;
      }
      if (!musicList.hidden && !musicWidget.contains(e.target)) {
        musicList.hidden = true;
      }
    });
    function applyBg(url) {
      if (url) {
        document.body.style.backgroundImage = 'url("' + url + '")';
      } else {
        document.body.style.backgroundImage = '';
      }
    }
    function markActive(url) {
      var opts = bgList.querySelectorAll('.bg-opt');
      for (var i = 0; i < opts.length; i++) {
        opts[i].classList.toggle('active', opts[i].getAttribute('data-bg') === url);
      }
    }
    bgList.addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== bgList && !(t.getAttribute && t.getAttribute('data-bg'))) t = t.parentNode;
      var url = t && t.getAttribute ? t.getAttribute('data-bg') : null;
      if (!url) return;
      applyBg(url);
      try { localStorage.setItem(KEY_BG, url); } catch (e) {}
      markActive(url);
    });
    function setMusicNow(text) {
      musicNow.textContent = text;
    }
    function markMusicActive(url) {
      var opts = musicList.querySelectorAll('.music-opt');
      for (var i = 0; i < opts.length; i++) {
        opts[i].classList.toggle('active', opts[i].getAttribute('data-mp3') === url);
      }
    }
    function stopAudio() {
      if (audio) {
        audio.pause();
        audio = null;
      }
      currentMp3 = '';
      currentLabel = '';
      musicBtn.classList.remove('mw-playing');
      musicSeek.value = 0;
      musicCur.textContent = '0:00';
      musicDur.textContent = '0:00';
      syncPlayBtn();
    }
    /* 播放控制按钮图标联动：有曲目时显示，播放=stop 样式，暂停=play 样式 */
    function syncPlayBtn() {
      if (audio && currentMp3) {
        musicPlayBtn.hidden = false;
        musicPlayImg.src = audio.paused ? '/text/play.png' : '/text/stop.png';
      } else {
        musicPlayBtn.hidden = true;
      }
    }
    musicPlayBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!audio || !currentMp3) return;
      if (audio.paused) {
        audio.play();
        musicBtn.classList.add('mw-playing');
        setMusicNow('正在播放：' + currentLabel);
        syncPlayBtn();
      } else {
        audio.pause();
        musicBtn.classList.remove('mw-playing');
        setMusicNow('已暂停：' + currentLabel);
        syncPlayBtn();
      }
    });
    function fmtTime(t) {
      t = Math.floor(t || 0);
      var m = Math.floor(t / 60);
      var s = t % 60;
      return m + ':' + (s < 10 ? '0' + s : '' + s);
    }
    function updateProgress() {
      if (audio && audio.duration && isFinite(audio.duration) && audio.duration > 0) {
        musicSeek.value = Math.round(audio.currentTime / audio.duration * 1000);
        musicCur.textContent = fmtTime(audio.currentTime);
        musicDur.textContent = fmtTime(audio.duration);
      }
    }
    musicList.addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== musicList && !(t.getAttribute && t.getAttribute('data-mp3'))) t = t.parentNode;
      var url = t && t.getAttribute ? t.getAttribute('data-mp3') : null;
      var label = t && t.textContent ? t.textContent : url;
      if (!url) return;
      if (currentMp3 === url) {
        if (audio && !audio.paused) {
          audio.pause();
          musicBtn.classList.remove('mw-playing');
          setMusicNow('已暂停：' + label);
          syncPlayBtn();
        } else if (audio) {
          audio.play();
          musicBtn.classList.add('mw-playing');
          setMusicNow('正在播放：' + label);
          syncPlayBtn();
        }
        return;
      }
      stopAudio();
      currentMp3 = url;
      currentLabel = label;
      audio = new Audio(url);
      audio.addEventListener('loadedmetadata', updateProgress);
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('ended', function () {
        musicBtn.classList.remove('mw-playing');
        currentMp3 = '';
        currentLabel = '';
        setMusicNow('播放结束：' + label);
        markMusicActive('');
        syncPlayBtn();
      });
      audio.play();
      musicBtn.classList.add('mw-playing');
      setMusicNow('正在播放：' + label);
      markMusicActive(url);
      syncPlayBtn();
    });
    /* 进度条拖动 seek：拖动不中断音频流 */
    musicSeek.addEventListener('input', function () {
      if (audio && audio.duration && isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = audio.duration * musicSeek.value / 1000;
        musicCur.textContent = fmtTime(audio.currentTime);
      }
    });
    /* 组件拖动：mousedown/mousemove/mouseup，限制在视口内，避开按钮与进度条 */
    var mwDrag = null;
    musicWidget.addEventListener('mousedown', function (e) {
      if (e.target.closest('button') || e.target.closest('input')) return;
      e.preventDefault();
      var rect = musicWidget.getBoundingClientRect();
      musicWidget.style.left = rect.left + 'px';
      musicWidget.style.top = rect.top + 'px';
      musicWidget.style.bottom = 'auto';
      musicWidget.style.right = 'auto';
      mwDrag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
    });
    document.addEventListener('mousemove', function (e) {
      if (!mwDrag) return;
      var x = e.clientX - mwDrag.dx;
      var y = e.clientY - mwDrag.dy;
      x = Math.max(0, Math.min(x, window.innerWidth - musicWidget.offsetWidth));
      y = Math.max(0, Math.min(y, window.innerHeight - musicWidget.offsetHeight));
      musicWidget.style.left = x + 'px';
      musicWidget.style.top = y + 'px';
    });
    document.addEventListener('mouseup', function () {
      mwDrag = null;
    });
    /* 页面加载时恢复已保存设置 */
    try {
      var a = localStorage.getItem(KEY_ALPHA);
      if (a !== null) {
        alpha.value = a;
        alphaVal.textContent = a + '%';
        setVar('--glass-alpha', Number(a) / 100);
      }
      var o = localStorage.getItem(KEY_OPACITY);
      if (o !== null) {
        opacity.value = o;
        opacityVal.textContent = o + '%';
        setVar('--glass-opacity', Number(o) / 100);
      }
      var b = localStorage.getItem(KEY_BG);
      if (b) {
        var url = b;
        try {
          var obj = JSON.parse(b);
          if (obj && obj.type === 'upload' && obj.data) url = obj.data;
        } catch (e) {}
        if (url) {
          applyBg(url);
          markActive(url);
        }
      }
    } catch (e) {}
    syncPlayBtn();
  })();
  </script>


  <div class="game-shell">
    <h1>谷歌恐龙闯关</h1>
    <canvas id="game" width="800" height="400"></canvas>
    <div class="hint"><kbd>空格</kbd>/<kbd>↑</kbd> 跳跃 · <kbd>↓</kbd> 俯冲 · 游戏结束后按 <kbd>空格</kbd> 重新开始</div>
  </div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 800, H = 400;
  var GROUND_Y = 320;

  // ---------------- 全局状态
  var state = { running: false, over: false, score: 0, speed: 6, time: 0, lastT: 0 };
  var obstacles = [];
  var nextSpawn = 80;   // 帧数倒计时（按 60fps 折算）

  // ---------------- 恐龙（y 为脚底坐标）
  var dino = { x: 80, y: GROUND_Y, w: 46, h: 52, vy: 0, jumping: false, ducking: false, fastFall: false, frame: 0, runT: 0 };
  var FAST_FALL_VY = 1400;      // 快速落地：滞空按下 ↓ 后的固定下坠速度（px/s），约 0.1 秒内触地
  var downPressed = false;      // ↓ 键是否按住（落地时若仍按住则自动进入俯冲）

  function dinoRect() {
    var h = dino.ducking ? dino.h * 0.52 : dino.h;
    return { x: dino.x, y: dino.y - h, w: dino.w, h: h };
  }

  function makeObstacle() {
    var r = Math.random();
    if (r < 0.55) {
      return { type: "cactus", x: W + 30, y: GROUND_Y, w: 24, h: 30 + Math.random() * 32, speedX: state.speed };
    }
    if (r < 0.85) {
      return { type: "pter", x: W + 40, y: GROUND_Y - 58, w: 44, h: 24, speedX: state.speed };
    }
    return { type: "pter", x: W + 40, y: GROUND_Y - 26, w: 44, h: 24, speedX: state.speed };
  }

  function resetGame() {
    obstacles.length = 0;
    nextSpawn = 80;
    state.score = 0;
    state.speed = 6;
    state.time = 0;
    state.over = false;
    state.running = true;
    dino.y = GROUND_Y;
    dino.vy = 0;
    dino.jumping = false;
    dino.ducking = false;
    dino.fastFall = false;
    downPressed = false;
    dino.frame = 0;
    dino.runT = 0;
  }

  function jump() {
    if (state.over) { resetGame(); return; }
    if (!state.running) { resetGame(); return; }
    if (!dino.jumping) {
      dino.jumping = true;
      dino.ducking = false;
      dino.fastFall = false;
      dino.vy = -430;
    }
  }

  function duck(on) {
    if (state.over || !state.running || dino.jumping) return;
    dino.ducking = on;
  }

  // ---------------- 核心循环
  function step(dt) {
    if (!state.running || state.over) return;
    state.time += dt;

    // 恐龙物理
    if (dino.jumping) {
      if (dino.fastFall) {
        // 快速落地：滞空按下 ↓ 后以固定高速强下坠，约 0.1 秒内触地
        dino.vy = FAST_FALL_VY;
      } else {
        dino.vy += 1150 * dt;
      }
      dino.y += dino.vy * dt;
      if (dino.y >= GROUND_Y) {
        dino.y = GROUND_Y; dino.vy = 0; dino.jumping = false; dino.fastFall = false;
        if (downPressed) duck(true); // 落地时 ↓ 仍按住则无缝衔接俯冲
      }
    }
    dino.runT += dt;
    if (dino.runT > 0.12) { dino.runT = 0; dino.frame = (dino.frame + 1) % 2; }

    // 障碍移动
    for (var i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= state.speed * 60 * dt;
      if (obstacles[i].x + obstacles[i].w < -20) obstacles.splice(i, 1);
    }

    // 生成障碍
    nextSpawn -= 60 * dt;
    if (nextSpawn <= 0) {
      obstacles.push(makeObstacle());
      nextSpawn = 26 + Math.random() * 48;
    }

    // 速度与分数
    state.speed = Math.min(15, 6 + state.time * 0.11);
    state.score += state.speed * dt;

    // 碰撞
    if (hitTest()) { state.running = false; state.over = true; }
  }

  function hitTest() {
    var dr = dinoRect();
    for (var i = 0; i < obstacles.length; i++) {
      var ob = obstacles[i];
      var r = { x: ob.x, y: ob.y - ob.h, w: ob.w, h: ob.h };
      if (dr.x + dr.w > r.x + 4 && dr.x < r.x + r.w - 4 &&
          dr.y + dr.h > r.y + 4 && dr.y < r.y + r.h - 4) return true;
    }
    return false;
  }

  // ---------------- 绘制
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#3a3c4a";
    ctx.fillRect(0, GROUND_Y, W, 2);
    ctx.fillStyle = "#e7e7ef";
    ctx.font = "16px Consolas, monospace";
    ctx.textAlign = "right";
    ctx.fillText("HI " + Math.floor(state.score), W - 22, 30);

    for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
    drawDino();

    if (state.over) {
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(231,231,239,0.92)";
      ctx.font = "bold 30px Consolas, monospace";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 8);
      ctx.font = "14px Consolas, monospace";
      ctx.fillStyle = "rgba(231,231,239,0.7)";
      ctx.fillText("按 空格 重新开始", W / 2, H / 2 + 22);
    } else if (!state.running) {
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(231,231,239,0.85)";
      ctx.font = "bold 24px Consolas, monospace";
      ctx.fillText("按 空格 开始", W / 2, H / 2 - 10);
    }
  }

  function drawObstacle(ob) {
    ctx.fillStyle = "#e7e7ef";
    if (ob.type === "cactus") {
      ctx.fillRect(ob.x, ob.y - ob.h, ob.w, ob.h);
      ctx.fillRect(ob.x - 5, ob.y - ob.h * 0.55, 5, ob.h * 0.4);
      ctx.fillRect(ob.x + ob.w, ob.y - ob.h * 0.45, 5, ob.h * 0.3);
    } else {
      ctx.fillRect(ob.x, ob.y - 8, ob.w, 8);
      ctx.fillRect(ob.x + 8, ob.y - 24, 8, 16);
      ctx.fillRect(ob.x + ob.w - 8, ob.y - 24, 8, 16);
    }
  }

  function drawDino() {
    var r = dinoRect();
    ctx.fillStyle = "#e7e7ef";
    var bodyH = r.h * 0.62;
    var bodyX = r.x, bodyY = r.y + r.h - bodyH;
    ctx.fillRect(bodyX, bodyY, r.w - 10, bodyH);
    ctx.fillRect(bodyX + r.w - 12, bodyY - bodyH * 0.7 + 2, 16, 14);
    ctx.fillStyle = "#1d1e28";
    ctx.fillRect(bodyX + r.w - 6, bodyY - bodyH * 0.7 + 5, 3, 4);
    ctx.fillStyle = "#e7e7ef";
    ctx.fillRect(bodyX - 5, bodyY + 3, 6, bodyH * 0.5);
    if (dino.jumping) {
      ctx.fillRect(bodyX + 4, r.y + r.h - 8, 8, 8);
      ctx.fillRect(bodyX + 20, r.y + r.h - 8, 8, 8);
    } else if (dino.ducking) {
      ctx.fillRect(bodyX + 4, r.y + r.h - 4, 8, 4);
      ctx.fillRect(bodyX + 20, r.y + r.h - 4, 8, 4);
    } else {
      var leg = dino.frame === 0 ? 0 : 6;
      ctx.fillRect(bodyX + 4, r.y + r.h - 10, 8, 10 - leg);
      ctx.fillRect(bodyX + 20, r.y + r.h - 10 + leg, 8, 10 - leg);
    }
  }

  // ---------------- 主循环
  function frame(t) {
    var dt = Math.min(0.05, (t - state.lastT) / 1000 || 0.016);
    state.lastT = t;
    step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------------- 键盘
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      if (e.repeat) return;
      jump();
    } else if (e.code === "ArrowDown") {
      e.preventDefault();
      downPressed = true;
      if (dino.jumping) {
        dino.fastFall = true; // 滞空：快速落地（强下坠）
      } else {
        duck(true);           // 地面：俯冲压扁
      }
    }
  });
  document.addEventListener("keyup", function (e) {
    if (e.code === "ArrowDown") { downPressed = false; dino.fastFall = false; duck(false); }
  });
  canvas.addEventListener("mousedown", function () { jump(); });

  requestAnimationFrame(frame);

  // 供离线验证的钩子（浏览器中无副作用）
  window.__dinoTest = {
    state: state, dino: dino, obstacles: obstacles,
    resetGame: resetGame, jump: jump, duck: duck,
    step: step, hitTest: hitTest, makeObstacle: makeObstacle,
    dinoRect: dinoRect, GROUND_Y: GROUND_Y, FAST_FALL_VY: FAST_FALL_VY,
    getDownPressed: function () { return downPressed; },
    setDownPressed: function (v) { downPressed = v; }
  };
})();
</script>
